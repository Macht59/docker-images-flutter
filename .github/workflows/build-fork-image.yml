name: Build Flutter image

# Upstream builds on Cirrus CI with a token this fork cannot use.
# This workflow builds the same sdk/Dockerfile and pushes to this fork's GHCR.

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter SDK version (a tag in flutter/flutter)
        required: true
        default: 3.47.4

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sdk
          # amd64 only: the GitLab runners consuming this image are x86_64.
          platforms: linux/amd64
          push: true
          build-args: flutter_version=${{ inputs.flutter_version }}
          tags: ghcr.io/${{ github.repository_owner }}/flutter:${{ inputs.flutter_version }}
          # Override the upstream LABEL so GHCR links the package to this fork.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
